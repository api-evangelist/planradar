openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Notifications API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Notifications
  description: Manage all your account related notifications
paths:
  /api/v2/{customer_id}/notifications/{type}:
    get:
      summary: Get all new notification
      tags:
      - Notifications
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        description: 'Only allowed type: (system, tickets, downloads)'
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: pagesize
        in: query
        description: Maximum is 500, default is 25
        schema:
          type: integer
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdNotificationsByType
      x-operation-id-source: derived
  /api/v2/{customer_id}/notifications/{type}/mark_as_read:
    post:
      summary: Mark all notifications as read
      tags:
      - Notifications
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        description: 'Only allowed type: (system, tickets, downloads)'
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: postApiV2ByCustomerIdNotificationsByTypeMarkAsRead
      x-operation-id-source: derived
  /api/v2/{customer_id}/notifications/check_new:
    get:
      summary: get the count of all unread notifications for each type
      tags:
      - Notifications
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdNotificationsCheckNew
      x-operation-id-source: derived
  /api/v2/{customer_id}/notifications/{notification_id}/toggle_read:
    post:
      summary: Toggle the is_read flag of one notification
      tags:
      - Notifications
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: postApiV2ByCustomerIdNotificationsByNotificationIdToggleRead
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
