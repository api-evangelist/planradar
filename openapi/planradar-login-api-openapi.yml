openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Login API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Login
paths:
  /extend_session:
    get:
      summary: Extend the current user session
      tags:
      - Login
      description: Validates the current user and pushes `session[:auto_session_expires_at]` forward by the user's `timeout_interval` (defaults to 30 minutes). Returns 204 when authenticated, 401 otherwise.
      responses:
        '401':
          description: Not authenticated
      operationId: getExtendSession
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
