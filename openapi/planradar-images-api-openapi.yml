openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Images API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Images
  description: Attach images to tickets
paths:
  /api/v1/{customer_id}/projects/{project_id}/tickets/{ticket_uuid}/ticket_images/{image_uuid}:
    post:
      summary: Create image with base64 (file param as base64 string)
      tags:
      - Images
      description: 'Attach a new image to a ticket using a base64 encoded file.


        When the image belongs to a form field attachment, validation errors may be returned (e.g. field does not exist, max attachments exceeded, ticket locked, or field permission denied).'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        subject:
                          type: string
                        file:
                          type: string
                          description: The base64 encoded file
                        async:
                          type: boolean
                          description: boolean to process the image in the background
                        file-name:
                          type: string
                          description: Uploaded image name
                        created-on:
                          type: integer
                          description: 'Optional: Leave blank, current time will be used'
                        file-content-type:
                          type: string
                          description: Image content type
                        caption:
                          type: string
                          max_length: 255
                          description: Image caption
                        image-type:
                          type: integer
                          description: Image type 0 => Image, 1 => Plan annotation
      operationId: postApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketImagesByImageUuid
      x-operation-id-source: derived
    put:
      summary: Update the caption of an image
      tags:
      - Images
      description: Currently we only support updating the image caption
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      - name: image_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        caption:
                          type: string
                          max_length: 255
                          description: Image caption
      operationId: putApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketImagesByImageUuid
      x-operation-id-source: derived
    delete:
      summary: Delete an image from a ticket
      tags:
      - Images
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      - name: image_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      operationId: deleteApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketImagesByImageUuid
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/tickets/{ticket_uuid}/ticket_images/{image_uuid}/create_multipart:
    post:
      summary: Create image with multipart upload (file param as multipart)
      tags:
      - Images
      description: 'Attach a new image to a ticket using multipart upload.


        When the image belongs to a form field attachment, validation errors may be returned (e.g. field does not exist, max attachments exceeded, ticket locked, or field permission denied).'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        subject:
                          type: string
                        file:
                          type: string
                        async:
                          type: boolean
                          description: boolean to process the image in the background
                        file-name:
                          type: string
                          description: Uploaded image name
                        created-on:
                          type: integer
                          description: 'Optional: Leave blank, current time will be used'
                        file-content-type:
                          type: string
                          description: Image content type
                        caption:
                          type: string
                          max_length: 255
                          description: Image caption
                        image-type:
                          type: integer
                          description: Image type 0 => Image, 1 => Plan annotation
      operationId: postApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketImagesByImageUuidCreateMultipart
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
