openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Projects V2 API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Projects V2
  description: Read your projects
paths:
  /api/v2/{customer_id}/projects/{project_id}/project_groups:
    get:
      summary: Get project groups for selected project
      tags:
      - Projects V2
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: order_by
        in: query
        schema:
          type: string
      - name: order_how
        in: query
        schema:
          type: string
      responses:
        '404':
          description: Project Not Found
      operationId: getApiV2ByCustomerIdProjectsByProjectIdProjectGroups
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/memberships:
    get:
      summary: Returns all memberships of a specific project
      tags:
      - Projects V2
      description: This API returns all the users that are members of a specific project and their permissions.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: use 0 to return the memberships of all projects of the logged in customer
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Memberships Not Found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdMemberships
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/my_projects:
    get:
      summary: Returns all projects
      tags:
      - Projects V2
      description: This API returns all projects of the logged in customer.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Projects Not Found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsMyProjects
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects:
    get:
      summary: Returns a paginated list of projects
      tags:
      - Projects V2
      description: Returns projects the current user has access to, scoped by their customer permission. Users with the report_templates permission (and without limited_projects) receive all account projects so templates can be assigned across the account.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      - name: page
        in: query
        required: false
        description: Page number for pagination.
        schema:
          type: integer
      - name: pagesize
        in: query
        required: false
        description: Number of projects per page.
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: Sort expression. Defaults to project name ascending.
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Filters projects by name.
        schema:
          type: string
      - name: include_archived
        in: query
        required: false
        description: When present, archived projects are included in the result.
        schema:
          type: boolean
      - name: load_all
        in: query
        required: false
        description: When present, returns all matching projects without pagination.
        schema:
          type: boolean
      - name: load_template
        in: query
        required: false
        description: When true, scopes the result to projects relevant for the templates flow.
        schema:
          type: boolean
      responses:
        '200':
          description: Projects Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Total number of matching projects.
                      page:
                        type: integer
                        description: Current page number.
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjects
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
