openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Approval Workflows V2 API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Approval Workflows V2
  description: Create and manage reusable approval workflow templates
paths:
  /api/v2/{customer_id}/approval_workflows:
    post:
      summary: create new approval workflow
      tags:
      - Approval Workflows V2
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      responses:
        '422':
          description: Requests Not Created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        subject:
                          type: string
                        message:
                          type: string
                        description:
                          type: string
                        name:
                          type: string
                        steps:
                          type: array
                          items:
                            type: object
                            properties:
                              duration:
                                type: number
                                default: 1
                              approvers:
                                type: array
                                items:
                                  type: string
                                default:
                                - oll
                              name:
                                type: string
                                default: step_name
      operationId: postApiV2ByCustomerIdApprovalWorkflows
      x-operation-id-source: derived
    get:
      summary: list approval workflows
      tags:
      - Approval Workflows V2
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      - name: search
        in: query
        required: false
        description: Filter workflows by name (case-insensitive, minimum 3 characters)
        schema:
          type: string
      responses:
        '404':
          description: Requests Not Found
      operationId: getApiV2ByCustomerIdApprovalWorkflows
      x-operation-id-source: derived
  /api/v2/{customer_id}/approval_workflows/{id}:
    get:
      summary: load one approval workflow
      tags:
      - Approval Workflows V2
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: workflow Not Found
      operationId: getApiV2ByCustomerIdApprovalWorkflowsById
      x-operation-id-source: derived
    put:
      summary: edit one approval workflow
      tags:
      - Approval Workflows V2
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: workflow Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        subject:
                          type: string
                        message:
                          type: string
                        description:
                          type: string
                        name:
                          type: string
                        steps:
                          type: array
                          items:
                            type: object
                            properties:
                              order:
                                type: number
                              duration:
                                type: number
                                default: 1
                              approvers:
                                type: array
                                items:
                                  type: string
                                default:
                                - oll
                        steps_to_remove:
                          type: array
                          items:
                            type: string
      operationId: putApiV2ByCustomerIdApprovalWorkflowsById
      x-operation-id-source: derived
    delete:
      summary: remove one approval workflow
      tags:
      - Approval Workflows V2
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: workflow Not Found
      operationId: deleteApiV2ByCustomerIdApprovalWorkflowsById
      x-operation-id-source: derived
  /api/v2/{customer_id}/approval_workflows/reviewers:
    get:
      summary: list potential reviewers for a customer as long as they are…
      tags:
      - Approval Workflows V2
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          default: '100000'
      - name: search
        in: query
        description: user name
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: pagesize
        in: query
        schema:
          type: string
      responses:
        '404':
          description: Requests Not Found
      operationId: getApiV2ByCustomerIdApprovalWorkflowsReviewers
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
