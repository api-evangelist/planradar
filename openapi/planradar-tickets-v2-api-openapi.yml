openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Tickets V2 API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Tickets V2
  description: All operations on PlanRadar tickets
paths:
  /api/v2/{customer_id}/projects/{project_id}/tickets/journals:
    get:
      summary: Retrieve journals for all accessible tickets in a project
      tags:
      - Tickets V2
      description: 'Retrieve journal entries for every ticket the caller can access within the given project,

        in a single API call. Intended to replace individual `GET /tickets/{uuid}/journals` calls

        during ERP sync integrations.


        Counts as **1 API call**. Only returns journals from tickets the user has access to within

        the specified project. Field-level and document permissions are respected. Each journal

        entry includes `ticket-uuid` for mapping back to its ticket.


        **Pagination:** default 50, max 100 (server-enforced). Results ordered chronologically.


        **Typical sync flow:**

        1. `GET /tickets/journals?last_sync_date=...` with the timestamp from your last sync (this endpoint)

        2. Process changes, store new sync timestamp'
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Encoded customer ID
        example: ymjxnx
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        description: Encoded project ID
        example: xqwprl
        schema:
          type: string
      - name: last_sync_date
        in: query
        required: false
        description: ISO 8601 datetime. Only return journal entries created on or after this datetime. Use for incremental sync — pass the timestamp from your last successful sync.
        example: '2026-03-20T10:15:00Z'
        schema:
          type: string
      - name: prop_keys
        in: query
        required: false
        description: Comma-separated list of journal_details.prop_key values to filter by (e.g. status_id, assigned_to_id). When provided, only journals with a matching detail row are returned.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        required: false
        description: Page number (1-based). Defaults to 1.
        example: 1
        schema:
          type: integer
      - name: pagesize
        in: query
        required: false
        description: 'Number of journal entries per page. Default: 50. Maximum: 100 (server-enforced, values above 100 are clamped).'
        example: 50
        schema:
          type: integer
      responses:
        '200':
          description: Paginated — page and pagesize control the window
        '401':
          description: Unauthorized — missing or invalid API key
        '404':
          description: Caller is not a member of the project
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsJournals
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets:
    get:
      summary: Returns all tickets
      tags:
      - Tickets V2
      description: 'This API returns all tickets of a specific project.


        Without any extra parameters it will return the first 100 tickets ordered by ascending ID. Extra parameters can be added to filter and sort the results.


        Ticket Sorting:

        Tickets can be sorted by their attributes like component_id, priority_id etc. .

        The sort is always ascending unless the field name is prefixed with a minus (U+002D HYPHEN-MINUS, “-“) i.e. `-id` or `id`.


        Example: `/tickets?sort=-component_id`


        Ticket Filtring:

        You can use one of your created filters by providing its id to the `apply_filter` parameter. Moreover, you can use the on-fly filters.


        On-Fly Filters:

        You can filter tickets based on the value of any of their attributes using structured filter parameters. Both simple and advanced formats are supported.


        Simple Format: `filter[{field}]={value}` - Direct field-value filtering


        Advanced Format: `filter[{field}][][predicate]={predicate}&filter[{field}][][value][]={value}` - Complex filtering with predicates


        Simple Format Examples:


        • Filter by status: `/tickets?filter[status_id]=1` (Open tickets)


        • Filter by priority: `/tickets?filter[priority_id]=3` (High priority)


        • Multiple simple filters: `/tickets?filter[status_id]=1&filter[priority_id]=3`


        Advanced Format Examples:


        • Filter by status with ''in'' predicate: `/tickets?filter[status_id][][predicate]=in&filter[status_id][][value][]=1&filter[status_id][][value][]=2`


        • Filter by multiple conditions: `/tickets?filter[status_id][][predicate]=in&filter[status_id][][value][]=1&filter[priority_id][][predicate]=eq&filter[priority_id][][value][]=3`


        • Text search with ''like'': `/tickets?filter[subject][][predicate]=like&filter[subject][][value][]=urgent`


        • Date range filtering: `/tickets?filter[created_at][][predicate]=between&filter[created_at][][value][]=2024-01-01&filter[created_at][][value][]=2024-12-31`


        Available Predicates: eq, neq, in, not_in, like, not_like, between, has, has_not, le, ge


        Image Loading:

        You can set load_images to true if you want the images of a ticket to be returned as well


        Status Dictionary: [1 (lm)= Open, 2 (ol) = In-Progress, 3 (ma) = Resolved, 4 (ex) = Feedback, 5 (gk) = Closed, 6 (ky) = Rejected]

        Priority Dictionary: [1 = Low, 2 = Normal, 3 = High]'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        description: Set project_id to `0` if you want to load the tickets of all projects
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned tickets
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of tickets that should be returned per page <br/>Maximum is 500, default is 100
        schema:
          type: integer
      - name: last_sync_date
        in: query
        description: is a Unix Timestamp. If it is set, only tickets that were created after that timestamp will be returned
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: filter[status_id]
        in: query
        description: "Simple status ID filter. Use status codes: 1=Open, 2=In-Progress, 3=Resolved, 4=Feedback, 5=Closed, 6=Rejected. Example: filter[status_id]=1 - Structured filter parameter supporting multiple conditions and predicates. You can use either simple or advanced format.<br/>\n      <b>Status ID Mapping:</b> 1 (lm)=Open, 2 (ol)=In-Progress, 3 (ma)=Resolved, 4 (ex)=Feedback, 5 (gk)=Closed, 6 (ky)=Rejected<br/>\n      <b>Simple Format:</b> filter[{field}]={value} - Example: filter[status_id]=1<br/>\n      <b>Advanced Format:</b> filter[{field}][][predicate]={predicate}&filter[{field}][][value][]={value}<br/>\n      <b>Supported Fields:</b> status_id, priority-id, assigned-to-id, author-id, subject, created-at, due-date, etc.<br/>\n      <b>Predicates:</b> eq (equals), neq (not equals), in (in list), not_in (not in list), like (contains), not_like (not contains), between (range), has (has value), has_not (no value), le (less/equal), ge (greater/equal)<br/>\n      <b>Examples:</b><br/>\n      • Simple: filter[status_id]=1 for filtering tickets with status 1<br/>\n      • Advanced: filter[status_id][][predicate]=in&filter[status_id][][value][]=1&filter[status_id][][value][]=2 for filtering tickets with status 1 or 2"
        schema:
          type: string
      - name: apply_filter
        in: query
        schema:
          type: string
      - name: load_images
        in: query
        description: sets whether or not the images of a ticket should be returned
        schema:
          type: boolean
      - name: can_have_parent
        in: query
        description: load only ticket that could have parent
        schema:
          type: boolean
      - name: search
        in: query
        description: keyword, based on which the tickets will be filtered
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTickets
      x-operation-id-source: derived
    post:
      summary: Creates ticket
      tags:
      - Tickets V2
      description: 'This API is used for creating a ticket.


        customer-id: Can be set to null in the request body to create a ticket without a customer association (used for form field attachment pre-upload tickets).


        The response includes typed_values_metadata which contains metadata about form field attachments (e.g. has_attachments per field_id).


        Note: Do not modify the meta-options attribute - it is reserved for internal use.


        Ticket Example:


        {

        "data": {

        "attributes": {

        "uuid": "35b03889-e759-4ded-b848-24337eea10d2",

        "subject": "After the Banality Post-Painterly Art of Misfortune",

        "typed-values": {

        "tf37e04757dabbca63": 33.52511960017461,

        "tf601be06c9a1c46f7": "1989-06-05T23:16:06.412+00:00",

        "tfd4367f50e84a9408": "Arbitrary Sustainability Daring to Defy Dysfunction"

        },

        "assigned-to-id": "gpk",

        "status-id": "ma",

        "component-id": "nyk",

        "ticket-type-id": "obk",

        "customer-id": "ymjxnx"

        }

        }

        }'
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not Created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      $ref: '#/components/schemas/Ticket'
      operationId: postApiV2ByCustomerIdProjectsByProjectIdTickets
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/tickets_position:
    get:
      summary: Returns tickets positions
      tags:
      - Tickets V2
      description: This API returns all tickets positions of a specific project without pagination.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsTicketsPosition
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/export/xls:
    post:
      summary: Exports filtered tickets as Excel file
      tags:
      - Tickets V2
      description: This API is used for exporting tickets as an Excel file based on their filter
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: pagesize
        in: query
        description: Maximum is 500, default is 100
        schema:
          type: integer
      - name: last_sync_date
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: filter
        in: query
        schema:
          type: string
      - name: apply_filter
        in: query
        description: filterid, based on which the tickets should be filtered
        schema:
          type: string
      - name: search
        in: query
        description: keyword, based on which the tickets should be filtered
        schema:
          type: string
      - name: async
        in: query
        description: Set to true to force asynchronous (background) processing. When enabled, the response returns a job ID instead of the file directly.
        schema:
          type: boolean
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: postApiV2ByCustomerIdProjectsByProjectIdTicketsExportXls
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/{uuid}/single_ticket_export:
    get:
      summary: Exports specific ticket
      tags:
      - Tickets V2
      description: This API is used for exporting a specific ticket based on its uuid.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the ticket
        required: true
        schema:
          type: string
      - name: pagesize
        in: query
        description: Maximum is 500, default is 100
        schema:
          type: integer
      - name: last_sync_date
        in: query
        schema:
          type: string
      - name: timezone_offset
        in: query
        description: ' -timestamp, is the difference between local time and the worlwide UTC time '
        schema:
          type: integer
      - name: async
        in: query
        description: Set to true to force asynchronous (background) processing. When enabled, the response returns a job ID instead of the file directly.
        schema:
          type: boolean
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsByUuidSingleTicketExport
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/{uuid}:
    get:
      summary: Returns specific ticket
      description: 'This API returns a specific ticket based on its uuid.


        The response includes a typed_values_metadata attribute, which is a JSON object containing metadata about typed field values.

        For form field attachment fields, it includes has_attachments per field_id.


        Example: { "ft123456789": { "has_attachments": true } }


        Note: Do not modify the meta-options attribute - it is reserved for internal use.'
      tags:
      - Tickets V2
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the ticket
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not Found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsByUuid
      x-operation-id-source: derived
    delete:
      summary: Deletes specific ticket
      tags:
      - Tickets V2
      description: This API is used for deleting a specific ticket based on its uuid.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the ticket
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: deleteApiV2ByCustomerIdProjectsByProjectIdTicketsByUuid
      x-operation-id-source: derived
    put:
      summary: Updates specific ticket
      tags:
      - Tickets V2
      description: 'This API is used for updating the details of a specific ticket based on its uuid.


        The response includes typed_values_metadata which contains metadata about form field attachments (e.g. has_attachments per field_id).


        Note: Do not modify the meta-options attribute - it is reserved for internal use.'
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the ticket
        required: true
        schema:
          type: string
      - name: clean_up_assets
        in: query
        description: If set to true, triggers a background job to remove any orphaned assets (images, documents, audios, videos) that no longer belong to the ticket
        schema:
          type: boolean
      responses:
        '404':
          description: Ticket Not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      $ref: '#/components/schemas/Ticket'
              required:
              - title
              - content
      operationId: putApiV2ByCustomerIdProjectsByProjectIdTicketsByUuid
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/{uuid}/mark_as_seen:
    get:
      summary: Marks specific ticket as seen
      tags:
      - Tickets V2
      description: This API is used for marking a specific ticket as seen if the request is done by the ticket asignee, else it returns whether or not the ticket was marked as seen.
      parameters:
