      summary: Returns all recurring reminders
      tags:
      - Tickets V2
      description: This API returns all recurring reminders of the tickets of the logged in customer.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned reminders
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of reminders that should be returned per page <br> Maximum is 500, default is 100
        schema:
          type: integer
      - name: last_sync_date
        in: query
        description: is a Unix Timestamp. If it is set, only reminders that were created after that timestamp will be returned
        schema:
          type: string
      responses:
        '406':
          description: unsupported accept header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsLoadRecurringReminders
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/ticket_types_stats:
    get:
      summary: Returns the count of tickets per ticket type
      tags:
      - Tickets V2
      description: 'This API returns the count of tickets per ticket types. Extra parameters can be added to filter the results.


        Ticket Filtering

        You can filter the results by one of your created filters by providing its id to the apply_filter parameter.


        Example: ticket_types_stats?apply_filter=jpg


        Moreover, the results can be filtered based on any condition of the related model.

        filter[author_id]=1 will list all tickets related to this author id.

        filter[author_email]=1 will list all tickets related to this author email.

        Multiple filters can be used at the same time.


        Example: filter[id][]=PN&filter[id][]=nE


        Available Models: customer, ticket_type, project, component, status, ticket, author, assigned_to, updated_by, due_by, overdue_by, creation_period'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        schema:
          type: string
      - name: apply_filter
        in: query
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsTicketTypesStats
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/tickets/batch_update:
    put:
      summary: Updates multiple tickets at once
      tags:
      - Tickets V2
      description: 'This API is used for updating multiple tickets at once based on the provided filteration. However, no filter will update all the data of the project.


        Filtering

        You can filter the tickets by one of your created filters by providing its id to the apply_filter attribute.

        Moreover, the tickets can be filtered based on any condition of the related model. These have to be set in the filter object of the body.

        Multiple filters can be used at the same time.


        Example:


        {

        "apply_filter":"mod",

        "filter":{

        "uuid":[

        {

        "predicate":"in",

        "value":[

        "b404f669-e02a-4273-bcff-aac72b31386f",

        "fa30521c-bf68-4246-b50f-29fd9c91ee5f"

        ]

        }

        ]

        },

        "data":{

        "attributes":{

        "priority-id":"ol"

        },

        "obk":{

        "tf37e04757dabbca63":"4",

        "tf7ae8b29ea4b4c1e9":[

        "makw"

        ],

        "typed-values-metadata":{

        "tf37e04757dabbca63":{

        "note":"observation details",

        "has_attachments":true

        }

        }

        }

        }

        }


        CheckList Fields in Batch Update


        When updating CheckList fields (CustomFields::CheckListType), typed-values-metadata must be placed inside the ticket_type_id bucket alongside the typed values. The server extracts it automatically.


        Silent Skip Behavior: If a checklist field requires a mandatory note or attachment and the metadata is not provided, the checklist field update is silently skipped for that ticket. Other fields in the same batch update are still applied normally.'
      x-websocket-response:
        channel: user_{customerId}_{userId}
        message_type: cable-events
        payload:
          type: object
          properties:
            multiupdate-progress:
              type: integer
              description: Always 1, signals completion
            failed-count:
              type: integer
              description: Number of tickets that failed to update
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tickets Updated
          content:
            application/json:
              schema:
                type: object
