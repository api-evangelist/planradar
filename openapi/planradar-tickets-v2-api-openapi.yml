          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned journals
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of journals that should be returned per page. Maximum is 500, default is 100
        schema:
          type: integer
      - name: journals_after
        in: string
        description: 'is a Unix Timestamp. If it is set, only journals that were created after that timestamp will be returned <br /> Caution: page number will be reset if this flag is set'
        schema:
          type: integer
      - name: last_sync_date
        in: query
        description: is a Unix Timestamp. If it is set, only journals that were created after that timestamp will be returned
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketsByUuidJournals
      x-operation-id-source: derived
