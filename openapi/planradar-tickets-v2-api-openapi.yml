        Example: `/journals?sort=-created_on`


        Journals Filtering:

        Journals can be filtered by type. If filter is not set, all journal types will be returned.


        Example: `/journals?filter=3`


        Filter Dictionary: [1 = comments, 2 = media, 3 = journals]'
      security:
      - apiKey: []
      parameters:
