openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Videos API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Videos
paths:
  /api/v1/{customer_id}/projects/{project_id}/tickets/{ticket_uuid}/ticket_videos/list:
    get:
      summary: Retrieves all videos by ticket
      tags:
      - Videos
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: blog not found
        '406':
          description: unsupported accept header
      operationId: getApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketVideosList
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/tickets/{ticket_uuid}/ticket_videos/{video_uuid}:
    put:
      summary: Update Video caption
      tags:
      - Videos
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      - name: video_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        caption:
                          type: string
        description: Caption cannot exceed 250 chars, validation error will be returned
      operationId: putApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketVideosByVideoUuid
      x-operation-id-source: derived
    delete:
      summary: Delete an video from a ticket
      tags:
      - Videos
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      - name: video_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      operationId: deleteApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketVideosByVideoUuid
      x-operation-id-source: derived
    get:
      summary: Get the details of one video
      tags:
      - Videos
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      - name: video_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      operationId: getApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketVideosByVideoUuid
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/tickets/{ticket_uuid}/ticket_videos:
    post:
      summary: Create video with base64 or file attachement)
      tags:
      - Videos
      description: '-Video duration should not exceed 30 sec.

        -If you will upload video as base64 attach the value to `base64` key and you must fill video-content-type key.

        -If you will upload video as binary attach the value to `video` key and you donot need to fill video-content-type key.

        -Caption cannot exceed 250 chars, validation error will be returned.


        When the video belongs to a form field attachment, validation errors may be returned (e.g. field does not exist, max attachments exceeded, ticket locked, or field permission denied).'
      x-websocket-response:
        channel: user_{customerId}_{authorId}
        message_type: videos
        payload:
          type: object
          description: Serialized video object (V2::VideoSerializer) sent after async processing completes
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: ticket_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Ticket Not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        video:
                          type: string
                        base64:
                          type: string
                        video-content-type:
                          type: string
                        caption:
                          type: string
                        uuid:
                          type: string
      operationId: postApiV1ByCustomerIdProjectsByProjectIdTicketsByTicketUuidTicketVideos
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
