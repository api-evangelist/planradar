  /api/v2/{customer_id}/projects/{project_id}/dms/nodes/copy_attachments_to_dms_validation:
    post:
      summary: validate before copying ticket attachments to DMS
      tags:
      - DMS
      security:
      - apiKey: []
      description: Validate the selected ticket attachments before copying them into DMS. Surfaces scan / processed / file_data issues, the per-customer max-attachments limit (`copy_to_dms_max_limit`, default 10) and resolves the target folder (or DMS root when parent_id is omitted). When `field_id` is omitted, field (form-field) attachments are ignored — only general ticket attachments are eligible.
      produces:
      - application/json
      parameters:
      - name: customer_id
        in: path
        type: string
        required: true
      - name: project_id
        in: path
        type: string
        required: true
      - name: filter
        in: query
        type: string
        description: "Selects ticket attachments by their file_attachment uuid (same contract as the ticket-attachments listing / delete endpoints). Example for two files in bulk:\n          ?filter[uuid][][predicate]=in&filter[uuid][][value][]=sdfs83sd-...&filter[uuid][][value][]=kjlsf83-..."
      - name: parent_id
        in: query
        type: string
        description: Optional. UUID of the destination DMS folder. Omit to target the DMS root ("All Files"). Must be a folder when present — file / virtual_component destinations are rejected.
      - name: ticket_uuid
        in: query
        type: string
        description: Optional. Scopes the source listing to a single ticket; otherwise selection is driven entirely by the uuid filter. Required when `field_id` is provided (422 otherwise).
      - name: field_id
        in: query
        type: string
        description: Optional. Scopes the copy to a single form field (a CustomFields::AttachmentType field id, e.g. `tf…`). When set, only that field's attachments are copied and a `ticket_uuid` is required. When omitted, field (form-field) attachments are ignored entirely — only general ticket attachments are copied.
      responses:
        '404':
          description: project not found
  /api/v2/{customer_id}/projects/{project_id}/dms/nodes/copy_attachments_to_dms:
    post:
      summary: copy ticket attachments to DMS
      tags:
      - DMS
      security:
      - apiKey: []
      description: Copy ticket attachments into DMS in bulk. Enqueues `Dms::CopyAttachmentsJob` which writes one DMS node per source attachment under the destination folder (or DMS root when parent_id is omitted), clones the S3 objects, emits a `copy_to_dms` activity log per created node, writes a `file_copied_to_dms` ticket journal on the source ticket, and sends the completion WebSocket message below. When `field_id` is omitted, field (form-field) attachments are ignored — only general ticket attachments are copied.
      x-websocket-response:
      - channel: user_{customerId}_{userId}
        message_type: dms-copy-attachments-to-dms-job
        payload:
          type: object
          properties:
            file-group-uuid:
              type: string
              description: UUID grouping this copy operation
            finished-at:
              type: string
              format: date-time
            success:
              type: boolean
            created-node-uuids:
              type: array
              description: UUIDs of the new DMS nodes created under the destination folder. Empty array when success is false.
              items:
                type: string
                format: uuid
              example:
              - e6fdcbdb-cdd9-4de3-b993-284834a6a291
              - 7e53b595-6bbb-4e1c-ad5f-77db9f329181
      - channel: customer_{customerId}
        message_type: dms_log_created
        payload:
          type: object
          description: ActivityLog entry broadcast per created node (copy_to_dms event)
          properties:
            node_ids:
              type: array
              items:
                type: string
              description: Encoded node IDs
      produces:
      - application/json
      parameters:
      - name: customer_id
        in: path
        type: string
        required: true
      - name: project_id
        in: path
        type: string
        required: true
      - name: filter
        in: query
        type: string
        description: 'Selects ticket attachments by their file_attachment uuid (same contract as the ticket-attachments listing / delete endpoints). Example for two files in bulk: ?filter[uuid][][predicate]=in&filter[uuid][][value][]=sdfs83sd-...&filter[uuid][][value][]=kjlsf83-...'
      - name: ticket_uuid
        in: query
        type: string
        description: Optional. Scopes the source listing to a single ticket; otherwise selection is driven by the uuid filter. Required when `field_id` is provided (422 otherwise).
      - name: field_id
        in: query
        type: string
        description: Optional. Scopes the copy to a single form field (a CustomFields::AttachmentType field id, e.g. `tf…`). When set, only that field's attachments are copied and a `ticket_uuid` is required. When omitted, field (form-field) attachments are ignored entirely — only general ticket attachments are copied.
      - name: data[attributes][parent_id]
        in: formData
        type: string
        description: Optional. UUID of the destination DMS folder. Omit to target the DMS root ("All Files") — requires DMS create permission on the root.
      - name: data[attributes][file_group_uuid]
        in: formData
        type: string
        description: Optional. UUID grouping the copy operation; surfaced back on the completion WebSocket message. Auto-generated when omitted.
      responses:
        '404':
          description: project not found
  /api/v2/{customer_id}/projects/{project_id}/dms/nodes/copy_to_tickets:
    post:
      summary: validate before copying files to tickets
      tags:
      - DMS
      security:
      - apiKey: []
      description: "Copy files from DMS to tickets in bulk. Enqueues a background job that sends a\n          WebSocket message on completion."
      x-websocket-response:
      - channel: user_{customerId}_{userId}
        message_type: dms-copy-to-tickets-job
        payload:
          type: object
          properties:
            file-group-uuid:
              type: string
              description: UUID grouping this copy operation
            finished-at:
              type: string
              format: date-time
            success:
              type: boolean
            created-node-uuids-by-ticket:
              type: object
              description: Map of ticket UUID → field ID → array of created node UUIDs. Field key is 'general' for ticket-level attachments, or the form field ID for field-level attachments.
              example:
                8957df73-ae89-411a-8e9d-368432d64912:
                  general:
                  - e6fdcbdb-cdd9-4de3-b993-284834a6a291
                  tf8ac26c3f7ec24666:
                  - 7e53b595-6bbb-4e1c-ad5f-77db9f329181
              additionalProperties:
                type: object
                description: Ticket UUID as key
                additionalProperties:
                  type: array
                  description: '''general'' or form field ID as key'
                  items:
                    type: string
                    format: uuid
                    description: Created node UUID
      - channel: customer_{customerId}
        message_type: dms_log_created
        payload:
          type: object
          description: ActivityLog entry broadcast per created node (copy_to_ticket event)
          properties:
            node_ids:
              type: array
              items:
                type: string
              description: Encoded node IDs
      produces:
      - application/json
      parameters:
      - name: customer_id
        in: path
        type: string
        required: true
      - name: project_id
        in: path
        type: string
        required: true
      - name: filter
        in: query
        type: string
        description: "to copy 2 files in bulk the query param will look like this\n          ?filter[uuid][][predicate]=eq&filter[uuid][][value]=sdfs83sd-...&filter[uuid][][predicate]=eq&filter[uuid][][value]=kjlsf83-..."
      - name: data[attributes][ticket_uuids]
        in: formData
        type: array
        description: the uuids of the tickets that you want to copy the files to
      - name: data[attributes][file_group_uuid]
        in: formData
        type: string
      - name: parent_id
        in: query
        type: string
        description: this has to be included if your current folder is not in the root level
      - name: search_in_all_folders
        in: query
        type: string
        description: true|false default value is false if set true this will copy all the files and folders in the project
      - name: search_in_all_subfolders
        in: query
        type: string
        description: true|false default value is false if set true this will load all the dms nodes scoped by a specific parent, if no parent_id provided it will just work like search_in_all_folders
      - name: copy_to_all_files
        in: query
        type: string
        description: 'this value needs to be true when copying a document from documents by layers to all files '
      - name: data[attributes][fields_by_tickets]
        in: formData
        type: object
        description: optional hash mapping ticket_uuid (with dashes replaced by underscores) to an array of field IDs. When provided, the files will be attached to the specified form fields on each ticket.
      - name: data[attributes][ticket_type_id]
        in: formData
        type: string
        description: optional encoded ticket type ID. When provided and a target ticket is a draft (customer_id is NULL), sets the ticket_type_id on the draft ticket before processing.
      responses:
        '404':
          description: nodes not found
