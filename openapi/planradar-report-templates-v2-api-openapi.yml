openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Report Templates V2 API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Report Templates V2
  description: Get all the report templates of your account in order to be able to export tickets with them
paths:
  /api/v2/{customer_id}/report_templates:
    get:
      summary: Returns all report templates
      tags:
      - Report Templates V2
      description: 'This API returns all report templates of a customer. Report templates can be of type PDF or XLS

        Extra parameters can be added to filter and sort the results.


        Report Template Sorting:

        The results can be sorted by name, creation time or creator

        The sort is always ascending unless the field name is prefixed with a minus i.e. -created-at


        Example#1: Sorting report templates by the creator

        `/report_templates?sort=created-by`


        Example#2: Sorting report templates by descending creation time

        `/report_templates?sort=-created-at`


        Report Template Filtering:

        The results can be filtered by template type 0: PDF templates, 1: XLS templates

        If type is left empty all types of templates will be returned.


        Example:

        `/report_templates?type=0`'
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: last_sync_date
        in: query
        description: is a Unix Timestamp. If it is set, only report templates that were created after that timestamp will be returned
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: pagesize
        in: query
        description: sets the number of report templates that should be returned per page <br> Maximum is 500, default is 100
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned report templates
        schema:
          type: string
      - name: type
        in: query
        description: limits the response to a specific template type
        schema:
          type: string
      responses:
        '404':
          description: Report Templates Not Found
      operationId: getApiV2ByCustomerIdReportTemplates
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
