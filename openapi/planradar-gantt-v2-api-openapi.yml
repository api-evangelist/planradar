openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Gantt V2 API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Gantt V2
paths:
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks:
    get:
      summary: Retrieves All Phases for a specific projects
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: list all the filters
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: last_sync_date
        in: query
        schema:
          type: string
      - name: pagesize
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: component_id
        in: query
        schema:
          type: string
      - name: hide_closed_tickets
        in: query
        schema:
          type: boolean
      - name: ids
        in: query
        description: ID's for the need gantt tasks
        schema:
          type: array
          items:
            type: string
      responses:
        '404':
          description: Phases/Tasks not found
      operationId: getApiV2ByCustomerIdProjectsByProjectIdGanttTasks
      x-operation-id-source: derived
    post:
      summary: Create New Phase/Task
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Create new phase / task
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        title:
                          type: string
                        duration:
                          type: integer
                        auto:
                          type: boolean
                        start_date:
                          type: string
                        end_date:
                          type: string
                        parent_id:
                          type: string
                        progress:
                          type: integer
                        has_custom_progress:
                          type: boolean
        description: 'parent_id: Phase id to set the new phase as a sub phase'
      operationId: postApiV2ByCustomerIdProjectsByProjectIdGanttTasks
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks/{id}:
    put:
      summary: Update Phase/Task
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Update phase / task
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        title:
                          type: string
                        start_date:
                          type: string
                        end_date:
                          type: string
                        parent_id:
                          type: string
                        duration:
                          type: integer
                        auto:
                          type: boolean
                        task_order:
                          type: integer
                        progress:
                          type: integer
                        has_custom_progress:
                          type: boolean
        description: 'parent_id: Phase id to set the phase as a sub phase, task_order: Order of the task/phase in the same level of the tree'
      operationId: putApiV2ByCustomerIdProjectsByProjectIdGanttTasksById
      x-operation-id-source: derived
    delete:
      summary: Delete Phase/Task
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Delete phase / task
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      operationId: deleteApiV2ByCustomerIdProjectsByProjectIdGanttTasksById
      x-operation-id-source: derived
    get:
      summary: Retrieve Phase/Task
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Retrieve phase / task
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      operationId: getApiV2ByCustomerIdProjectsByProjectIdGanttTasksById
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks/{id}/clone:
    post:
      summary: Clone Phase/Task
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Clone phase / task
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      operationId: postApiV2ByCustomerIdProjectsByProjectIdGanttTasksByIdClone
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks/attach_ticket:
    post:
      summary: Attach Ticket to Phase/Task
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Add ticket to phase / task
      x-websocket-response:
        channel: user_{customerId}_{userId}
        message_type: cable-events
        payload:
          type: object
          properties:
            assign-ticket-to-gantt-finished:
              type: boolean
              description: Always true, signals completion
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: pagesize
        in: query
        description: Maximum is 500, default is 100
        schema:
          type: integer
      - name: last_sync_date
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: filter
        in: query
        schema:
          type: string
      - name: apply_filter
        in: query
        description: filterid, based on which the tickets should be filtered
        schema:
          type: string
      - name: search
        in: query
        description: keyword, based on which the tickets should be filtered
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        start_date:
                          type: string
                        end_date:
                          type: string
                        parent_id:
                          type: string
                        uuids:
                          type: array
                          items:
                            type: string
        description: 'uuids: array of tickets uuids will be attached to a phase, parent_id: the phase which the tickets will be attached to'
      operationId: postApiV2ByCustomerIdProjectsByProjectIdGanttTasksAttachTicket
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks/import:
    post:
      summary: Import Gantt Tasks
      tags:
      - Gantt V2
      security:
      - apiKey: []
      x-websocket-response:
        channel: user_{customerId}_{userId}
        message_type: gantt_tasks_import
        payload:
          type: object
          properties:
            progress:
              type: integer
              description: Import progress percentage (0-100)
            status:
              type: string
              description: Import status
              enum:
              - progress
              - failed
              - done
            errors:
              type: object
              description: Import errors (present when status is failed)
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data[attributes][file]:
                  type: string
                  format: binary
      operationId: postApiV2ByCustomerIdProjectsByProjectIdGanttTasksImport
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks/sync_scheduler:
    post:
      summary: Import Gantt Tasks
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Get the status of scheduler if mpp or any other supported format was imported
      x-websocket-response:
        channel: user_{customerId}_{userId}
        message_type: gantt_tasks_sync
        payload:
          type: object
          properties:
            new_tasks:
              type: array
              description: Newly added tasks
              items:
                type: object
                properties:
                  id:
                    type: integer
                  subject:
                    type: string
            matched_tasks:
              type: array
              description: Tasks matched to existing ones
              items:
                type: object
                properties:
                  id:
                    type: integer
                  subject:
                    type: string
            deleted_tasks:
              type: array
              description: Tasks deleted during sync
              items:
                type: object
                properties:
                  id:
                    type: integer
                  subject:
                    type: string
            removed_linked_tasks:
              type: array
              description: Linked tasks removed
              items:
                type: object
                properties:
                  id:
                    type: integer
                  subject:
                    type: string
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data[][attributes][file]:
                  type: string
                  format: binary
      operationId: postApiV2ByCustomerIdProjectsByProjectIdGanttTasksSyncScheduler
      x-operation-id-source: derived
  /api/v2/{customer_id}/projects/{project_id}/gantt_tasks/export:
    get:
      summary: Export Gantt Tasks
      tags:
      - Gantt V2
      security:
      - apiKey: []
      description: Export the Gantt chart for a project (e.g. PDF/XML).
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Task/Phase Errors
      operationId: getApiV2ByCustomerIdProjectsByProjectIdGanttTasksExport
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
