openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Projects API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Projects
  description: Read your projects, add or remove members to the project
paths:
  /api/v1/{customer_id}/projects/{project_id}/memberships:
    get:
      summary: Get all project memberships
      tags:
      - Projects
      description: Get all users that are member of a specific project
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: use 0 to return all project memberships
        required: true
        schema:
          type: string
      - name: last_sync_date
        in: query
        required: false
        description: Unix timestamp in seconds. When provided, returns only memberships changed after this time (incremental sync). Omit or use 0 to return all memberships. Non-numeric values are ignored.
        schema:
          type: integer
      responses:
        '404':
          description: project not found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdProjectsByProjectIdMemberships
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/project_groups:
    get:
      summary: Returns all groups of a specific project
      tags:
      - Projects
      description: 'This API returns all groups of a specific project based on its id. Without any extra parameters it will return the first 100 groups ordered by ascending ID. Extra parameters can be added to sort the results.

        Group Sorting: Groups can be sorted by the amount of users they have.

        Example: `/project_groups?sort=count`

        Moreover, they can be sorted by the groups''s name: group.name, the leader''s first name: leader.firstname or the leader''s email: leader.mail. The sort is always ascending unless the field name is prefixed with a minus (U+002D HYPHEN-MINUS, “-“) i.e. `-id` or `id`.

        Example: `/project_groups?sort=-group.name`'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned groups
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of groups that should be returned per page <br/>Maximum is 500, default is 100
        schema:
          type: integer
      - name: check_inhouse
        in: query
        description: sets whether or not the returned groups should contain an in house user type
        schema:
          type: boolean
      responses:
        '404':
          description: Project Not Found
      operationId: getApiV1ByCustomerIdProjectsByProjectIdProjectGroups
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/users:
    get:
      summary: Returns all users of a project
      tags:
      - Projects
      description: 'This API returns all users of a specific project including customer permissions and groups.

        Without any extra parameters it will return the first 100 users ordered by ascending ID. Extra parameters can be added to sort the results.

        User Sorting: Users can be sorted by their attributes e.g id, firstname, lastname, company. Moreover, the results can be sorted by other characteristics such as customer_permissions and project_memberships. The sort is always ascending unless the field name is prefixed with a minus (U+002D HYPHEN-MINUS, “-“) i.e. `-id` or `id`.

        Example#1: `/users?sort=-firstname`


        Example#2: `/users?sort=customer-permissions.permission-type`


        Example#3: `/users?sort=project-memberships.defectradar_role_id`'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: set project id to 0 if you want to get all the users that are part of projects
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned users
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of users that should be returned per page <br/>Maximum is 500, default is 100
        schema:
          type: integer
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '404':
          description: Users Not Found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdProjectsByProjectIdUsers
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/add_member_to_project:
    post:
      summary: Adds specific user/s to project
      tags:
      - Projects
      description: This API is used for assigning a specific user to a specific project.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: User Or Project Not Found
        '406':
          description: Unsupported Accept Header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        all:
                          type: boolean
                          example: false
                          description: sets whether or not all groups of the customer should be added to the project
                        is_mobile_sync:
                          type: boolean
                          example: false
                          description: 'sets whether or not the data should be synced on a mobile phone '
                        white_list:
                          type: array
                          items:
                            type: string
                            example: byk
                          description: ' contains all the ids of the users that should be added to the project'
                        black_list:
                          type: array
                          items:
                            type: string
                            example: lmw
                          description: contains all the ids of the users that are deselected and should therefore be removed from the project
                        roleId:
                          type: string
                          example: lm
                          description: id of the role that should be assigned to the added user/s
      operationId: postApiV1ByCustomerIdProjectsByProjectIdAddMemberToProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/remove_member_from_project:
    post:
      summary: Removes specific member from project
      tags:
      - Projects
      description: This API is used for removing a specific user from a specific project.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Member Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        userId:
                          type: string
                          description: 'id of the user that should be removed from the project '
                        force_unassign_issues:
                          type: boolean
                          description: if is set to `true` all the tickets that are assigned to this user will be unassigned
      operationId: postApiV1ByCustomerIdProjectsByProjectIdRemoveMemberFromProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/add_group_to_project:
    post:
      summary: Adds specific group/s to project
      tags:
      - Projects
      description: This API is used for adding one group or multiple groups with a specific role to a specific project based on its id.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Group or Role Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        all:
                          type: boolean
                          example: false
                          description: ' sets whether or not all groups of the customer should be added to the project'
                        black_list:
                          type: array
                          items:
                            type: string
                            example: oll
                            description: contains all the ids of the groups that are deselected and should therefore be removed from the project
                        white_list:
                          type: array
                          items:
                            type: string
                            example: gpk
                            description: contains all the ids of the groups that should be added to the project
                        roleId:
                          type: string
                          example: lm
                          description: id of the role that should be assigned to the added group/s
              required:
              - title
              - content
      operationId: postApiV1ByCustomerIdProjectsByProjectIdAddGroupToProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/update_project_member_role:
    put:
      summary: Updates specific member role of project
      tags:
      - Projects
      description: This API is used for updating the role of a specific member of a specific project
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Project Or User Not Found not found
        '406':
          description: Unsupported Accept Header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        roleId:
                          type: string
                          example: lm
                          description: id of the new role - is required
                        userId:
                          type: string
                          exmample: byk
                          description: id of the user - is required
      operationId: putApiV1ByCustomerIdProjectsByProjectIdUpdateProjectMemberRole
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects:
    get:
      summary: Returns all projects
      tags:
      - Projects
      description: 'This API returns all projects of the logged in customer. Without any extra parameters it will return the first 100 projects ordered by ascending ID. Extra parameters can be added to sort the results.

        Project Sorting:

        Projects can be sorted by the project''s id: running_number, project''s name: name, project''s code: projectnumber, project''s start date: drstart_date, project''s end date: drend_date, project''s zipcode: zipcode, project''s city: city, project''s street: street, project''s country: country. The sort is always ascending unless the field name is prefixed with a minus (U+002D HYPHEN-MINUS, “-“) i.e. `-id` or `id`

        Example#1: sorting projects by descending name `/projects?sort=-name`

        Example#2: sorting projects by ascending start date `/projects?sort=drstart_date`'
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: pagesize
        in: query
        description: sets the number of projects that should be returned per page <br/>Maximum is 500, default is 100
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned projects
        schema:
          type: string
      responses:
        '404':
          description: Projects Not Found
      operationId: getApiV1ByCustomerIdProjects
      x-operation-id-source: derived
    post:
      summary: Creates project
      tags:
      - Projects
      description: This API is used for creating a new project.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '422':
          description: Unprocessable Entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          type: string
                          example: firstproject
                          description: name of the project
                        street:
                          type: string
                          example: Some Street
                          description: street of the project
                        zipcode:
                          type: string
                          example: '1010'
                          description: zipcode of the project
                        city:
                          type: string
                          example: Vienna
                          description: city of the project
                        country:
                          type: string
                          example: Austria
                          description: country of the project
                        description:
                          type: string
                          example: This is the first project
                          description: description of the project
                        drend-date:
                          type: string
                          example: '2022-02-26T00:00:00.000Z'
                          description: end date of the project
                        drstart-date:
                          type: string
                          example: '2022-02-23T10:02:25.000Z'
                          description: start date of the project
                        homepage:
                          type: string
                          example: https://www.planradar.com
                          description: homepage of the project
                        bruttosize:
                          type: integer
                        budget:
                          type: integer
                        drend_date:
                          type: string
                        drstart_date:
                          type: string
                        identifier:
                          type: string
                        is_active:
                          type: boolean
                        is_customer:
                          type: boolean
                        is_public:
                          type: boolean
                        nettosize:
                          type: integer
                        parent_id:
                          type: integer
                        projectnumber:
                          type: integer
                          example: 52512510244225
                          description: code of the project
                        status:
                          type: integer
                          default: 1
                          example: 1
                        fields:
                          type: array
                          items:
                            type: object
                            description: is an array that contains the project's custom created fields and their values
                            properties:
                              edit:
                                type: boolean
                                example: true
                                description: sets whether or not the field can be edited
                              id:
                                type: string
                                example: b5723873-a607-4ea6-956a-6d5663f1953b
                                description: id of the field
                              name:
                                type: string
                                example: first-field
                                description: name of the field
                              type:
                                type: string
                                example: CustomFields::LongTextType
                                description: 'type of the field - allowed values are: CustomFields::ShortTextType, CustomFields::LongTextType, CustomFields::BooleanType, CustomFields::DateType, CustomFields::FloatType, CustomFields::ListType, CustomFields::IntegerType, CustomFields::TimeType, CustomFields::CheckListType'
                              value:
                                type: string
                                example: firstvalue
                                description: value of the field
              required:
              - name
              - projectnumber
      operationId: postApiV1ByCustomerIdProjects
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/copy_project:
    post:
      summary: Copies specific project
      tags:
      - Projects
      description: This API is used for copying a specific project based on its id.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: sets the name of the copy of the project
        schema:
          type: string
      - name: details
        in: query
        description: sets whether or not the copy of the project should contain the project's details
        schema:
          type: boolean
      - name: groups
        in: query
        description: sets whether or not the copy of the project should contain the project's groups
        schema:
          type: boolean
      - name: ticket_types
        in: query
        description: sets whether or not the copy of the project should contain the project's forms and lists
        schema:
          type: boolean
      - name: users
        in: query
        description: sets whether or not the copy of the project should contain the project's users
        schema:
          type: boolean
      - name: components
        in: query
        description: sets whether or not the copy of the project should contain the project's layers and plans
        schema:
          type: boolean
      responses:
        '404':
          description: project not found
        '406':
          description: Unsupported Accept Header
      operationId: postApiV1ByCustomerIdProjectsByProjectIdCopyProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/export_project:
    get:
      summary: Exports data of a specific project
      tags:
      - Projects
      description: This API is used for exporting the data of a specific project based on its id.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: filter_id
        in: query
        description: 'id of the filter of the tickets that should be exported with the project '
        schema:
          type: string
      - name: timezone_offset
        in: query
        description: is a timestamp - is the difference between the local time and the worlwide UTC time
        schema:
          type: string
      - name: includedocuments
        in: query
        description: sets whether or not all documents should be included in the export
        schema:
          type: boolean
      responses:
        '404':
          description: Project Not Found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdProjectsByProjectIdExportProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}:
    get:
      summary: Returns specific project
      tags:
      - Projects
      description: This API returns a specific project based on its id.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Project Not Found
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdProjectsByProjectId
      x-operation-id-source: derived
    put:
      summary: Updates specific project
      tags:
      - Projects
      description: This API is used for updating a specific project based on its id.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '422':
          description: Unprocessable Entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        name:
                          type: string
                          example: firstproject
                          description: name of the project
                        running-number:
                          type: string
                          description: 'project count in relation to the user, example: 5 (this means that this is the 5th created project of the customer)'
                        parent-id-hashed:
                          type: string
                          description: ' hashed id of the logged in customer - is optional'
                        typed-fields:
                          type: array
                          items:
                            type: object
                            description: is an array that contains the project's custom created fields and their values
                            properties:
                              edit:
                                type: boolean
                                example: true
                                description: sets whether or not the field can be edited
                              id:
                                type: string
                                example: b5723873-a607-4ea6-956a-6d5663f1953b
                                description: id of the field
                              name:
                                type: string
                                example: first-field
                                description: name of the field
                              type:
                                type: string
                                example: CustomFields::LongTextType
                                description: 'type of the field - allowed values are: CustomFields::ShortTextType, CustomFields::LongTextType, CustomFields::BooleanType, CustomFields::DateType, CustomFields::FloatType, CustomFields::ListType, CustomFields::IntegerType, CustomFields::TimeType, CustomFields::CheckListType'
                              value:
                                type: string
                                example: firstvalue
                                description: value of the field
                        typed-values:
                          type: object
                          description: 'sets the values of the typed-fields of the project. This is a partial update: fields omitted from the object keep their stored value, fields included with a value overwrite it, and fields included with an empty value (null or empty string) are removed.'
                        projectnumber:
                          type: string
                          example: '52512510244225'
                          description: code of the project
                        street:
                          type: string
                          example: Some Street
                          description: street of the project
                        zipcode:
                          type: string
                          example: '1010'
                          description: zipcode of the project
                        city:
                          type: string
                          example: Vienna
                          description: city of the project
                        country:
                          type: string
                          example: Austria
                          description: country of the project
                        description:
                          type: string
                          example: This is the first project
                          description: description of the project
                        drend-date:
                          type: string
                          example: '2022-02-23T00:00:00.000Z'
                          description: end date of the project
                        drstart-date:
                          type: string
                          example: '2022-02-16T10:02:25.000Z'
                          description: start date of the project
                        homepage:
                          type: string
                          example: https://www.planradarproject.com
                          description: homepage of the project
                        fields:
                          type: array
                          items:
                            type: object
                            description: is an array that contains the project's custom created fields and their values
                            properties:
                              edit:
                                type: boolean
                                example: true
                                description: sets whether or not the field can be edited
                              id:
                                type: string
                                example: b5723873-a607-4ea6-956a-6d5663f1953b
                                description: id of the field
                              name:
                                type: string
                                example: first-field
                                description: name of the field
                              type:
                                type: string
                                example: CustomFields::LongTextType
                                description: 'type of the field - allowed values are: CustomFields::ShortTextType, CustomFields::LongTextType, CustomFields::BooleanType, CustomFields::DateType, CustomFields::FloatType, CustomFields::ListType, CustomFields::IntegerType, CustomFields::TimeType, CustomFields::CheckListType'
                              value:
                                type: string
                                example: firstvalue
                                description: value of the field
                        schedule-start-date:
                          type: string
                          example: '2022-02-23'
                          description: schedule start date of the project
              required:
              - name
              - projectnumber
      operationId: putApiV1ByCustomerIdProjectsByProjectId
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/archive_project:
    put:
      summary: Archives/Unarchives specific project
      tags:
      - Projects
      description: This API is used for archiving/unarchiving a specific project based on its id.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Project Not found
        '406':
          description: Unsupported Accept Header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 9
                          description: if is set to 9 the project will be archived - if is set to 1 the project will be unarchived
      operationId: putApiV1ByCustomerIdProjectsByProjectIdArchiveProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/remove_group_from_project:
    post:
      summary: Removes a group from a specific project
      tags:
      - Projects
      description: This API is used for removing a specific group from a specific project.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Group Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        group_id:
                          type: string
                          example: lm
                          description: id of the group that should be removed from the project
                        remove_user:
                          type: boolean
                          example: true
                          description: if is set to `true` all the members of the group will be removed from the project as well
      operationId: postApiV1ByCustomerIdProjectsByProjectIdRemoveGroupFromProject
      x-operation-id-source: derived
  /api/v1/{customer_id}/projects/{project_id}/update_project_group_role:
    post:
      summary: Updates project's group role
      tags:
      - Projects
      description: This API is used for updating the role of a specific group that is assigned to a specific project.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Group Or Role Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        group_id:
                          type: string
                          example: lm
                          description: id of the group that should be updated - is required
                        role_id:
                          type: string
