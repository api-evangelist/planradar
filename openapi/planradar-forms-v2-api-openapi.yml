openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Forms V2 API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Forms V2
  description: Get your PlanRadar forms
paths:
  /api/v2/{customer_id}/projects/{project_id}/ticket_types/ticket_type_project:
    get:
      summary: Returns all ticket types of a specific project
      tags:
      - Forms V2
      security:
      - apiKey: []
      description: This API returns all forms aka ticket_types of a specific project or all the projects the user is involved in.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: if you want to load the ticket types of all projects set the project_id to 0
        required: true
        schema:
          type: string
      - name: last_sync_date
        in: query
        description: is a Unix Timestamp. If it is set, only ticket types that were created after that timestamp will be returned
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned ticket types
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of ticket types that should be returned per page<br/>Maximum is 500, default is 100
        schema:
          type: integer
      - name: apply_form_display_permission
        in: query
        required: false
        description: (KFT-338) when <code>true</code>, filters bound ticket_type_projects to forms the caller's role can see (<code>capabilities.visible_to</code> match or unrestricted). Watchers bypass. Results are cached per flag value. Default <code>false</code>.
        schema:
          type: boolean
      - name: apply_form_edit_permission
        in: query
        required: false
        description: (KFT-338) when <code>true</code>, filters bound ticket_type_projects to forms the caller's role can edit (<code>capabilities.editable_by</code> match or unrestricted). Independent of the display flag. Default <code>false</code>.
        schema:
          type: boolean
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV2ByCustomerIdProjectsByProjectIdTicketTypesTicketTypeProject
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
