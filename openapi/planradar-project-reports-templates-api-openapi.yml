openapi: 3.2.0
info:
  title: PlanRadar's API Documentation Project Reports Templates API
  version: '2.0'
  description: Welcome to PlanRadar's API documentation, here you can find all the details about our APIs as well as test them online.
servers:
- url: /
tags:
- name: Project Reports Templates
  description: Manage project report templates
paths:
  /api/v1/{customer_id}/site_report_templates:
    post:
      summary: Creates report template
      tags:
      - Project Reports Templates
      description: This API is used for creating a report template
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data[attributes][uuid]:
                  type: string
                data[attributes][file]:
                  type: string
                  description: is required - file must contain form fields
                  format: binary
                data[attributes][title]:
                  type: string
                  description: is required
                data[attributes][visibility]:
                  type: string
                  description: 'allowed values: "only_author", "all_users", " only_inhouse"'
                data[attributes][updated_at]:
                  type: string
                  description: is a Unix timestamp
                data[attributes][created_at]:
                  type: string
                  description: is a Unix timestamp
                data[attributes][support-image-upload]:
                  type: boolean
                data[attributes][allowed-image-size]:
                  type: string
                  description: 'allowed values: "small", "medium", "large"'
                data[attributes][allowed-image-description]:
                  type: string
                  description: 'allowed values: "date_time_caption", "date_caption", "caption"'
      operationId: postApiV1ByCustomerIdSiteReportTemplates
      x-operation-id-source: derived
    get:
      summary: Returns all report templates
      tags:
      - Project Reports Templates
      description: 'This API returns all report templates of the logged in customer. Without any extra parameters it will return the first 100 report templates ordered by ascending id. Extra parameters can be added to sort the results. The sort is always ascending unless the field name is prefixed with a minus (U+002D HYPHEN-MINUS, "-") i.e. `-id` or `id`.

        Report Template Sorting: Report Templates can be sorted by id: sequential-id, name: title, author: users-id, creation date: created-at or update date: updated-at.

        Example#1: `/site_report_templates?sort=-sequential-id`

        Example#2: `/site_report_templates?sort=created-at`'
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: search
        in: query
        description: search keyword based on which report templates are returned
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: page
        in: query
        description: sets the number of pages for the returned report templates
        schema:
          type: integer
      - name: pagesize
        in: query
        description: sets the number of report templates that should be returned per page <br/>Maximum is 500, default is 100
        schema:
          type: integer
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdSiteReportTemplates
      x-operation-id-source: derived
  /api/v1/{customer_id}/site_report_templates/{uuid}:
    put:
      summary: Updates specific report template
      tags:
      - Project Reports Templates
      description: This API is used for updating a specific report template based on its uuid.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the report template
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data[attributes][file]:
                  type: string
                  description: file must contain form fields
                  format: binary
                data[attributes][title]:
                  type: string
                data[attributes][visibility]:
                  type: string
                  description: 'allowed values: "only_author", "all_users", " only_inhouse"'
      operationId: putApiV1ByCustomerIdSiteReportTemplatesByUuid
      x-operation-id-source: derived
    get:
      summary: Returns specific report template
      tags:
      - Project Reports Templates
      description: This API returns a specific report template based on its uuid.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the report template
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdSiteReportTemplatesByUuid
      x-operation-id-source: derived
    delete:
      summary: Deletes specific report template
      tags:
      - Project Reports Templates
      description: This API is used for deleting a specific report template based on its uuid.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the report template
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: deleteApiV1ByCustomerIdSiteReportTemplatesByUuid
      x-operation-id-source: derived
  /api/v1/{customer_id}/site_report_templates/{uuid}/clone:
    get:
      summary: Clones specific report template
      tags:
      - Project Reports Templates
      description: This API is used for cloning a specific report template based on its uuid.
      security:
      - apiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: unique identifier of the report template that should be cloned
        required: true
        schema:
          type: string
      responses:
        '406':
          description: Unsupported Accept Header
      operationId: getApiV1ByCustomerIdSiteReportTemplatesByUuidClone
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-PlanRadar-API-Key
      in: header
externalDocs:
  description: Find out more about our development portal
  url: https://www.planradar.com/knowledge-base-overview/
