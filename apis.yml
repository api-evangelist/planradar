aid: planradar
name: PlanRadar
description: PlanRadar is a SaaS platform for construction and real estate documentation, defect and task
  management, and site inspections, used by builders, owners, facility managers, architects and engineers
  in more than 75 countries. Its secure REST Open API (v1 and v2) lets Pro and Enterprise customers read
  and manage projects, tickets, documents, DMS nodes, forms, plans, roles, approval requests and workflows,
  and Site View captures, generate asynchronous Excel and PDF exports, and subscribe to event webhooks.
  PlanRadar Connect, built on Workato, layers 200+ no-code integrations on top of the API for tools such
  as SharePoint, Power BI, Salesforce, Procore, SAP, Jira and Slack.
