note: PlanRadar sends account webhooks as JSON POSTs to a configured Target URL when selected events occur
  (e.g. a user updates a ticket). Webhooks are scoped to selected projects and configured in the WebApp
  (Details/Authentication/Headers tabs). Pro & Enterprise only; requires Accounts permission. PlanRadar
  does not publish a machine-readable event catalog or an AsyncAPI document.
configuration:
  target_url: required
  projects: select which projects trigger
  events: required selection of triggering events
  auth: optional Basic (account email + password) or custom request headers
