overlay: 1.0.0
info:
  title: API Evangelist enhancements for PlanRadar Open API
  version: 1.0.0
extends: openapi/planradar-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-20'
